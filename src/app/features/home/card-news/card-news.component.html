<mat-card class="example-card">
  <img mat-card-image src="{{ imageUrl }}" alt="Photo of a Shiba Inu" alt="Photo of a Shiba Inu">
  <mat-card-header>
    <mat-card-title class="card-title">{{ title }}</mat-card-title>
    <mat-card-subtitle>{{ published }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p class="description">
      {{ description }}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="accent">Read More</button>
  </mat-card-actions>
</mat-card>
