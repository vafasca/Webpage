<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Digital Harbor Bolivia</title>
    <base href="/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/webp" href="assets/images/icon_logo.webp">
    <link rel="preconnect" href="https://fonts.gstatic.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1976d2">
  </head>

  <body class="mat-typography">

    <!-- Preloader -->
    <div id="preloader">
      <div id="text-container">
        <span class="letter" style="--i:1">D</span>
        <span class="letter" style="--i:2">I</span>
        <span class="letter" style="--i:3">G</span>
        <span class="letter" style="--i:4">I</span>
        <span class="letter" style="--i:5">T</span>
        <span class="letter" style="--i:6">A</span>
        <span class="letter" style="--i:7">L</span>
        <span class="letter" style="--i:8">&nbsp;</span> <!-- Espacio entre palabras -->
        <span class="letter" style="--i:9">H</span>
        <span class="letter" style="--i:10">A</span>
        <span class="letter" style="--i:11">R</span>
        <span class="letter" style="--i:12">B</span>
        <span class="letter" style="--i:13">O</span>
        <span class="letter" style="--i:14">R</span>
      </div>
      <!-- Spinner and Loading text -->
      <div id="spinner-container">
        <div class="spinner"></div>
        <p id="loading-text">Loading...</p>
      </div>
    </div>

    <app-root></app-root>

    <script src="https://cdn.jsdelivr.net/npm/lite-youtube@latest/dist/lite-yt-video.js"></script>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
